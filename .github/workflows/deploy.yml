name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Triggers on pushes to the main branch
  workflow_dispatch: # Allows manual triggers from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Use 'pnpm' or 'yarn' if you use alternative managers

      - name: Install dependencies
        run: npm ci # Ensures a clean, predictable install

      - name: Build website
        run: npm run build
        env:
          VITE_DISCORD_WEBHOOK: ${{ vars.VITE_DISCORD_WEBHOOK }}


      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite outputs static files to the 'dist' folder by default

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
